name: Build Android & Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_DIR: artifacts/tradermind

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build web assets (Capacitor)
        run: pnpm exec vite build --config vite.capacitor.config.ts

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tradermind-android-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/*.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build renderer (Electron)
        run: pnpm exec vite build --config vite.electron.config.ts

      - name: Compile Electron main/preload
        run: pnpm exec tsc -p tsconfig.electron.json

      - name: Package Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --win --config electron-builder.json --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: tradermind-windows
          path: |
            ${{ env.APP_DIR }}/dist-electron/*.exe
            ${{ env.APP_DIR }}/dist-electron/*.msi
          if-no-files-found: error
